services:

  # ------------------------------------------------------------------ #
  # Infrastructure Layer (Ephemeral Storage)
  # ------------------------------------------------------------------ #

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aerosense-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - aerosense-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aerosense-kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: aerosense-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aerosense-net

  postgres:
    image: postgres:16-alpine
    container_name: aerosense-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: aerosense
    volumes:
      - /var/lib/postgresql/data
    networks:
      - aerosense-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aerosense"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.10-slim
    container_name: aerosense-mlflow
    ports:
      - "5000:5000"
    volumes:
      - /mlruns
    environment:
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_ALLOWED_HOSTS: "*"
    entrypoint: ["sh", "-c", "pip install --no-cache-dir 'mlflow==3.14.0' 'psycopg[binary]' && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense --default-artifact-root /mlruns --allowed-hosts '*'"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aerosense-net

  # ------------------------------------------------------------------ #
  # Streaming Ingestion & Core Applications
  # ------------------------------------------------------------------ #

  bronze-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: data-pipeline
    container_name: aerosense-bronze
    command: python -m ingestion.bronze_consumer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aerosense-net
    restart: on-failure

  silver-processor:
    build:
      context: .
      dockerfile: Dockerfile
      target: data-pipeline
    container_name: aerosense-silver
    command: python -m ingestion.silver_processor
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aerosense-net
    restart: on-failure

  gold-processor:
    build:
      context: .
      dockerfile: Dockerfile
      target: data-pipeline
    container_name: aerosense-gold
    command: python -m ingestion.gold_processor
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aerosense-net
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-api
    container_name: aerosense-api
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - aerosense-net
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: aerosense-streamlit
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aerosense-net
    restart: on-failure

  # ------------------------------------------------------------------ #
  # Sequential Training Pipeline Profile
  # ------------------------------------------------------------------ #

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-api
    container_name: aerosense-trainer
    command: python -m models.train
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - aerosense-net
    profiles:
      - pipeline

  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-api
    container_name: aerosense-evaluator
    command: python -m models.evaluate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_secure_password@postgres:5432/aerosense
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      trainer:
        condition: service_completed_successfully
    networks:
      - aerosense-net
    profiles:
      - pipeline

networks:
  aerosense-net:
    driver: bridge
