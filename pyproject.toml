[project]
name = "aerosense"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "confluent-kafka>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "structlog>=24.0",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "BLE",  # blind exception catch
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line too long -- ruff format handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
# drone_controller uses bare except in one place intentionally
"webots/controllers/drone_controller/drone_controller.py" = ["BLE001", "E401"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true   # controller imports (webots) not available in CI
exclude = ["webots/"]           # Webots controller can't be type-checked in CI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["bridge", "ingestion", "validation", "config", "db"]
omit = ["tests/*", "webots/*"]