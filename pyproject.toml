[project]
name = "aerosense"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "confluent-kafka>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "structlog>=24.0",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "polars>=0.20.0",
    "scikit-learn>=1.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx2",
    "mlflow",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "bridge*",
    "config*",
    "db*",
    "features*",
    "ingestion*",
    "models*",
    "validation*",
]
exclude = [
    "tests*",
    "webots*",
    "mlartifacts*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "BLE",
    "C4",
]

ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
"webots/controllers/drone_controller/drone_controller.py" = [
    "BLE001",
    "E401",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

exclude = [
    "webots/",
]

files = [
    "bridge",
    "config",
    "db",
    "features",
    "ingestion",
    "models",
    "validation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = [
    "bridge",
    "ingestion",
    "validation",
    "config",
    "db",
]

omit = [
    "tests/*",
    "webots/*",
]
